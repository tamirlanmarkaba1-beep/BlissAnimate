<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BlissChat — Вход через Google</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1615;
      --surface-low: #12201f;
      --surface: #172827;
      --surface-high: #1e3331;
      --surface-highest: #27403e;
      --primary: #74dfd4;
      --on-primary: #003733;
      --primary-container: #00504b;
      --on-primary-container: #9cf1e8;
      --secondary-container: #1d3634;
      --on-secondary-container: #ccebe7;
      --text-main: #e4f3f1;
      --text-muted: #98b7b3;
      --outline: rgba(116, 223, 212, 0.22);
      --outline-strong: rgba(116, 223, 212, 0.42);
      --error: #ff8a80;
      --error-container: rgba(255, 138, 128, 0.14);
      --ok-container: rgba(116, 223, 212, 0.14);
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.48);
      --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      position: relative;
      overflow-x: hidden;
    }

    /* Ровные зубчатые M3-фигуры на фоне */
    .m3-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .gear-top-right {
      position: absolute;
      width: clamp(220px, 52vw, 340px);
      height: clamp(220px, 52vw, 340px);
      top: -70px;
      right: -70px;
      opacity: 0.24;
      animation: spinSlow 36s linear infinite;
    }

    .gear-bottom-left {
      position: absolute;
      width: clamp(240px, 58vw, 380px);
      height: clamp(240px, 58vw, 380px);
      bottom: -85px;
      left: -85px;
      opacity: 0.2;
      animation: spinSlow 44s linear infinite reverse;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Основная ровная карточка */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(16, 29, 28, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--outline);
      border-radius: 32px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Иконка blisschat в стиле 2-го фото */
    .app-icon-box {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: #969e9d;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .app-icon-svg {
      width: 74px;
      height: 74px;
      display: block;
    }

    .m3-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 12.5px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .m3-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      flex: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.015em;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
      max-width: 28ch;
    }

    .btn-google {
      width: 100%;
      height: 54px;
      padding: 0 20px;
      border-radius: 27px;
      border: 1.5px solid var(--outline-strong);
      background: var(--surface-high);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.16s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-google:hover {
      background: var(--surface-highest);
      border-color: var(--primary);
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google:focus-visible,
    .btn-primary:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .g-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      display: grid;
      place-items: center;
      flex: none;
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      margin-top: 12px;
      border-radius: 26px;
      border: none;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.16s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.04);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .status {
      width: 100%;
      margin-top: 16px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
      color: var(--text-muted);
      word-break: break-word;
      line-height: 1.4;
      text-align: center;
    }

    .status.info,
    .status.ok,
    .status.error {
      padding: 10px 14px;
    }

    .status.info {
      background: var(--surface-low);
      border: 1px solid var(--outline);
    }

    .status.ok {
      background: var(--ok-container);
      color: var(--primary);
      border: 1px solid rgba(116, 223, 212, 0.32);
    }

    .status.error {
      background: var(--error-container);
      color: var(--error);
      border: 1px solid rgba(255, 138, 128, 0.32);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0.85;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="m3-bg" aria-hidden="true">
    <svg class="gear-top-right" viewBox="0 0 200 200">
      <path id="bgGear1" fill="#1d6b65"></path>
    </svg>
    <svg class="gear-bottom-left" viewBox="0 0 200 200">
      <path id="bgGear2" fill="#154e49"></path>
    </svg>
  </div>

  <main class="card">
    <div class="app-icon-box" aria-hidden="true">
      <svg class="app-icon-svg" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="blissGrad" x1="60" y1="12" x2="60" y2="108" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e827c" />
            <stop offset="52%" stop-color="#6b3228" />
            <stop offset="100%" stop-color="#b81d18" />
          </linearGradient>
        </defs>
        <path id="blissScallop" fill="url(#blissGrad)"></path>
        <circle cx="60" cy="60" r="21" fill="#969e9d" />
      </svg>
    </div>

    <div class="m3-badge">
      <span class="m3-dot"></span>
      <span>BlissChat · Material You</span>
    </div>

    <h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите через Google, чтобы вернуться в BlissChat</p>

    <button id="googleBtn" class="btn-google" type="button">
      <span class="g-circle" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.1 7.4 24 12 24z"/>
        </svg>
      </span>
      <span>Продолжить с Google</span>
    </button>

    <a id="openAppBtn" class="btn-primary" href="#">Открыть BlissChat</a>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p class="footer-note">Авторизация передаётся напрямую в приложение</p>
  </main>

  <script>
    // Построение ровных зубчатых / цветочных контуров в стиле Material You
    function buildScallopPath(cx, cy, outerR, innerR, lobes) {
      const steps = lobes * 2;
      let d = "";
      for (let i = 0; i <= steps; i++) {
        const a1 = (i / steps) * Math.PI * 2;
        const a2 = ((i + 0.5) / steps) * Math.PI * 2;
        const r1 = i % 2 === 0 ? outerR : innerR;
        const r2 = i % 2 === 0 ? innerR : outerR;
        const x1 = cx + Math.cos(a1) * r1;
        const y1 = cy + Math.sin(a1) * r1;
        if (i === 0) d += `M ${x1.toFixed(2)} ${y1.toFixed(2)} `;
        const ctrlX = cx + Math.cos((a1 + a2) * 0.5) * ((r1 + r2) * 0.53);
        const ctrlY = cy + Math.sin((a1 + a2) * 0.5) * ((r1 + r2) * 0.53);
        const endX = cx + Math.cos(a2) * r2;
        const endY = cy + Math.sin(a2) * r2;
        d += `Q ${ctrlX.toFixed(2)} ${ctrlY.toFixed(2)} ${endX.toFixed(2)} ${endY.toFixed(2)} `;
      }
      return d + "Z";
    }

    document.getElementById("blissScallop").setAttribute("d", buildScallopPath(60, 60, 48, 39, 14));
    document.getElementById("bgGear1").setAttribute("d", buildScallopPath(100, 100, 86, 68, 12));
    document.getElementById("bgGear2").setAttribute("d", buildScallopPath(100, 100, 88, 70, 10));
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUXc71LMSwk0Nb82bieZFZbGeMtJ5uU2s",
      authDomain: "bitrate-71684.firebaseapp.com",
      projectId: "bitrate-71684",
      storageBucket: "bitrate-71684.firebasestorage.app",
      messagingSenderId: "794345122154",
      appId: "1:794345122154:web:05b6f2241d89652b895d13"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const btn = document.getElementById("googleBtn");
    const openAppBtn = document.getElementById("openAppBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = type ? `status ${type}` : "status";
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      setStatus("Открываем окно выбора аккаунта...", "info");

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential?.idToken || await result.user.getIdToken();

        const deepLink = `blisschat://auth?idToken=${encodeURIComponent(idToken)}`;
        openAppBtn.href = deepLink;
        openAppBtn.style.display = "flex";

        setStatus(`Вы вошли как ${result.user.email}. Возвращаем в приложение...`, "ok");
        window.location.href = deepLink;
      } catch (err) {
        console.error(err);
        setStatus(`Ошибка входа: ${err.code || err.message}`, "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
