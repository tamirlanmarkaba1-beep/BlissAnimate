<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BlissChat — Вход через Google</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1615;
      --surface-low: #12201f;
      --surface: #172827;
      --surface-high: #1e3331;
      --surface-highest: #27403e;
      --primary: #74dfd4;
      --on-primary: #003733;
      --primary-container: #00504b;
      --on-primary-container: #9cf1e8;
      --secondary-container: #1f3936;
      --on-secondary-container: #ccebe7;
      --text-main: #e4f3f1;
      --text-muted: #98b7b3;
      --outline: rgba(116, 223, 212, 0.24);
      --outline-strong: rgba(116, 223, 212, 0.44);
      --error: #ff8a80;
      --error-container: rgba(255, 138, 128, 0.14);
      --ok-container: rgba(116, 223, 212, 0.14);
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
      --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      position: relative;
      overflow-x: hidden;
    }

    /* Органические фигуры Material You на фоне */
    .m3-shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .shape-organic-1 {
      position: absolute;
      width: min(76vw, 430px);
      aspect-ratio: 1;
      top: -120px;
      right: -110px;
      background: radial-gradient(circle at 35% 35%, #1c5751, #0d2b28 72%);
      border-radius: 58% 42% 46% 54% / 44% 60% 40% 56%;
      animation: floatSlow 11s ease-in-out infinite;
    }

    .shape-organic-2 {
      position: absolute;
      width: min(82vw, 460px);
      aspect-ratio: 1;
      bottom: -150px;
      left: -130px;
      background: radial-gradient(circle at 65% 30%, #154540, #091e1c 75%);
      border-radius: 43% 57% 62% 38% / 53% 39% 61% 47%;
      animation: floatSlow 13s ease-in-out infinite reverse;
    }

    .shape-pill {
      position: absolute;
      width: 140px;
      height: 54px;
      top: 14%;
      left: 8%;
      border-radius: 999px;
      background: rgba(116, 223, 212, 0.06);
      border: 1px solid rgba(116, 223, 212, 0.12);
      transform: rotate(-18deg);
    }

    @keyframes floatSlow {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      50% {
        transform: translate(10px, -14px) rotate(5deg);
      }
    }

    /* Основная M3 карточка */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 412px;
      background: linear-gradient(170deg, rgba(25, 44, 42, 0.92), rgba(15, 27, 26, 0.95));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--outline);
      border-radius: 36px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(18px);
      filter: blur(6px);
      animation: cardEnter 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* Фигурный M3-контейнер логотипа (cookie / squircle-wave) */
    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }

    .logo-m3-shape {
      position: absolute;
      inset: 0;
      background: var(--primary-container);
      border: 1.5px solid var(--outline-strong);
      border-radius: 38% 62% 48% 52% / 52% 38% 62% 48%;
      transform: rotate(-8deg);
      transition: border-radius 0.45s ease, transform 0.45s ease, background-color 0.3s ease;
    }

    .logo-wrap:hover .logo-m3-shape {
      border-radius: 54% 46% 39% 61% / 45% 58% 42% 55%;
      transform: rotate(6deg);
      background: #00635d;
    }

    .logo-m3-shape svg {
      position: relative;
      z-index: 1;
      width: 46px;
      height: 46px;
      transform: rotate(8deg);
      transition: transform 0.45s ease;
    }

    .logo-wrap:hover .logo-m3-shape svg {
      transform: rotate(-6deg);
    }

    .m3-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .m3-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    h1 {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
      max-width: 30ch;
      margin-inline: auto;
    }

    /* Кнопка Google в стиле M3 Outlined / Tonal Pill */
    .btn-google {
      width: 100%;
      min-height: 56px;
      padding: 0 20px;
      border-radius: 28px;
      border: 1.5px solid var(--outline-strong);
      background: var(--surface-high);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition:
        transform 0.18s cubic-bezier(0.3, 1.5, 0.5, 1),
        background-color 0.2s ease,
        border-color 0.2s ease,
        border-radius 0.22s ease;
    }

    .btn-google:hover {
      background: var(--surface-highest);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: scale(0.97);
      border-radius: 20px;
    }

    .btn-google:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
    }

    .btn-google:focus-visible,
    .btn-primary:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .g-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      display: grid;
      place-items: center;
      flex: none;
    }

    /* Основная кнопка M3 Filled Pill для возврата в приложение */
    .btn-primary {
      width: 100%;
      min-height: 54px;
      padding: 0 22px;
      margin-top: 12px;
      border-radius: 27px;
      border: none;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition:
        transform 0.18s cubic-bezier(0.3, 1.5, 0.5, 1),
        border-radius 0.22s ease,
        filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.97);
      border-radius: 20px;
    }

    /* Статусный чип / контейнер */
    .status {
      margin-top: 18px;
      padding: 0 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
      color: var(--text-muted);
      word-break: break-word;
      line-height: 1.4;
      transition: background-color 0.25s ease, color 0.25s ease, padding 0.25s ease;
    }

    .status.info,
    .status.ok,
    .status.error {
      padding: 10px 14px;
    }

    .status.info {
      background: var(--surface-low);
      color: var(--text-muted);
      border: 1px solid var(--outline);
    }

    .status.ok {
      background: var(--ok-container);
      color: var(--primary);
      border: 1px solid rgba(116, 223, 212, 0.32);
    }

    .status.error {
      background: var(--error-container);
      color: var(--error);
      border: 1px solid rgba(255, 138, 128, 0.32);
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .card {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="m3-shapes" aria-hidden="true">
    <div class="shape-organic-1"></div>
    <div class="shape-organic-2"></div>
    <div class="shape-pill"></div>
  </div>

  <main class="card">
    <div class="logo-wrap" aria-hidden="true">
      <div class="logo-m3-shape">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="8" y="10" width="22" height="16" rx="6" fill="#80d5c9" />
          <path d="M12 26L8 31V24H14L12 26Z" fill="#80d5c9" />
          <path d="M32 17H36C38.2 17 40 18.8 40 21V31C40 33.2 38.2 35 36 35H34V40L28 35H20C17.8 35 16 33.2 16 31V29" stroke="#80d5c9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div class="m3-badge">
      <span class="m3-dot"></span>
      <span>BlissChat · Material You</span>
    </div>

    <h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите через Google, чтобы вернуться в BlissChat</p>

    <button id="googleBtn" class="btn-google" type="button">
      <span class="g-circle" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.1 7.4 24 12 24z"/>
        </svg>
      </span>
      <span>Продолжить с Google</span>
    </button>

    <a id="openAppBtn" class="btn-primary" href="#">Открыть BlissChat</a>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p class="footer-note">Авторизация передаётся напрямую в приложение</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUXc71LMSwk0Nb82bieZFZbGeMtJ5uU2s",
      authDomain: "bitrate-71684.firebaseapp.com",
      projectId: "bitrate-71684",
      storageBucket: "bitrate-71684.firebasestorage.app",
      messagingSenderId: "794345122154",
      appId: "1:794345122154:web:05b6f2241d89652b895d13"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const btn = document.getElementById("googleBtn");
    const openAppBtn = document.getElementById("openAppBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = type ? `status ${type}` : "status";
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      setStatus("Открываем окно выбора аккаунта...", "info");

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential?.idToken || await result.user.getIdToken();

        const deepLink = `blisschat://auth?idToken=${encodeURIComponent(idToken)}`;
        openAppBtn.href = deepLink;
        openAppBtn.style.display = "flex";

        setStatus(`Вы вошли как ${result.user.email}. Возвращаем в приложение...`, "ok");
        window.location.href = deepLink;
      } catch (err) {
        console.error(err);
        setStatus(`Ошибка входа: ${err.code || err.message}`, "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
