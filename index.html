<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BlissAnimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1615;
      --surface: #132221;
      --surface-high: #1b2f2d;
      --primary: #74dfd4;
      --on-primary: #003733;
      --secondary-container: #1b3432;
      --on-secondary-container: #ccebe7;
      --fg: #e4f3f1;
      --muted: #98b7b3;
      --outline: rgba(116, 223, 212, 0.22);
      --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 32px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
      opacity: 0;
      filter: blur(10px);
      transform: translateY(16px);
      transition: opacity 0.6s ease, filter 0.9s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card.ready {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 12.5px;
      font-weight: 800;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    .photo-btn {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 68dvh;
      border: 1.5px solid var(--outline);
      border-radius: 24px;
      overflow: hidden;
      background: var(--surface-high);
      cursor: pointer;
      display: block;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .photo-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      transition: opacity 0.25s ease, filter 0.35s ease;
    }

    .photo-btn.switching img {
      opacity: 0.35;
      filter: blur(6px);
    }

    .hint {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 13.5px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      <span>BlissAnimate</span>
    </div>

    <button class="photo-btn" id="photoToggle" type="button" aria-label="Переключить фото">
      <img id="mainPhoto" src="Screenshot_20261118_101200_Vexel.jpg" alt="Vexel" draggable="false" />
    </button>

    <div class="state-pill" id="stateLabel">Vexel</div>
    <p class="hint" id="hintText">Нажми на фото, чтобы открыть с цифрами</p>
  </main>

  <script>
    const MAIN_SRC = "Screenshot_20261118_101200_Vexel.jpg";
    const NUMBERS_SRC = "1795540246710.jpg";

    const card = document.getElementById("card");
    const photoToggle = document.getElementById("photoToggle");
    const mainPhoto = document.getElementById("mainPhoto");
    const stateLabel = document.getElementById("stateLabel");
    const hintText = document.getElementById("hintText");

    // Предзагрузка второго фото, чтобы переключалось мгновенно
    const preload = new Image();
    preload.src = NUMBERS_SRC;

    requestAnimationFrame(() => card.classList.add("ready"));

    let showingNumbers = false;

    photoToggle.addEventListener("click", () => {
      showingNumbers = !showingNumbers;
      photoToggle.classList.add("switching");

      setTimeout(() => {
        if (showingNumbers) {
          mainPhoto.src = NUMBERS_SRC;
          mainPhoto.alt = "Фото с цифрами";
          stateLabel.textContent = "Фото с цифрами";
          hintText.textContent = "Нажми ещё раз, чтобы вернуть Vexel";
        } else {
          mainPhoto.src = MAIN_SRC;
          mainPhoto.alt = "Vexel";
          stateLabel.textContent = "Vexel";
          hintText.textContent = "Нажми на фото, чтобы открыть с цифрами";
        }
        photoToggle.classList.remove("switching");
      }, 120);
    });
  </script>
</body>
</html>
